<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "zh-CN" }}">

  <head>
    {% include head.html %}
  </head>

  <body class="site-body-root{% if page.layout == 'home' %} is-home{% endif %}">
    <a class="skip-link" href="#site-main">跳到正文</a>
    <div class="site-shell">
      <header class="site-header">
        {% include header.html %}
      </header>

      <main class="site-main-content" id="site-main" aria-label="正文" tabindex="-1">
        <div class="site-container">
          {{ content }}
        </div>
      </main>

      <footer class="site-footer">
        {% include footer.html %}
      </footer>
    </div>
  </body>

</html>
