# 网站标题（显示在浏览器标签页）
title: 去哪儿呢

# 网站描述（搜索引擎会抓取这句）
description: 记录学习、技术、阅读与生活。

# 你的名字
author: David Lee

# 头像路径
avatar: /assets/images/avatar.png

# 你的邮箱
email: daweili05@outlook.com

# 你的博客网址；部署到 Vercel 或自定义域名后再改成正式地址
url: "https://evanor05.github.io"

# 插件列表（保持默认即可）
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate

# 每页显示多少篇文章
paginate: 10

# 日期格式
date_format: "%Y-%m-%d"

# 统计和评论功能（暂时留空，想用的时候再填）
# google_analytics: 
# disqus:

# 构建时排除的文件（保持默认即可）
exclude:
  - scripts/
  - README.md
  - DEPLOY.md
  - LICENSE.txt
  - push.bat
  - vercel.json
  - IMG_4950.png
  - screenshot.png
  - screenshot-sunrise.png
  - screenshot-midnight.png

# SEO 设置
# =========================
twitter:
  username:  # 这里留空，除非你有Twitter账号，可以填在冒号后面
  card: summary

logo: /assets/images/avatar.png

social:
  name: 去哪儿呢
  links:
    # 这里只留了你的 GitHub，原来的 facebook/twitter 都删了
    - https://github.com/evanor05
    # 如果以后有其他链接，可以按格式加在下面
    # - https://www.zhihu.com/people/你的ID
# 语言设置为简体中文
lang: zh-CN

# 时区
timezone: Asia/Shanghai

# 固定主题皮肤，减少首屏额外 CSS 请求；可选 daylight/sunrise/sunset/midnight
skin: daylight
