name: Check posts

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  check-posts:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check post metadata
        shell: pwsh
        run: ./scripts/check-posts.ps1

      - name: Check local markdown links
        shell: pwsh
        run: ./scripts/check-links.ps1

  build-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build
