name: Check posts

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  check-posts:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check post metadata
        shell: pwsh
        run: ./scripts/check-posts.ps1

      - name: Check local markdown links
        shell: pwsh
        run: ./scripts/check-links.ps1

  build-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: |
          set -o pipefail
          bundle exec jekyll build --trace 2>&1 | tee "$RUNNER_TEMP/jekyll-build.log"

      - name: Add build error to run summary
        if: failure()
        run: |
          {
            echo '### Jekyll build error (last 80 lines)'
            echo '```text'
            tail -n 80 "$RUNNER_TEMP/jekyll-build.log" \
              | sed -E 's/(token|password|secret)=([^[:space:]]+)/\1=[REDACTED]/Ig'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
