<div class="header-container">
  <a class="header-brand" href="{{ '/' | relative_url }}">
    {% if site.avatar %}
      <img class="header-avatar" src="{{ site.avatar | relative_url }}" width="30" height="30" alt="{{ site.title | escape }}" decoding="async">
    {% endif %}
    <span class="header-title">{{ site.title | escape }}</span>
  </a>

  <button class="nav-toggle-btn" type="button" aria-expanded="false" aria-controls="header-nav-menu" aria-label="切换导航菜单">
    <span class="nav-toggle-bar"></span>
    <span class="nav-toggle-bar"></span>
    <span class="nav-toggle-bar"></span>
  </button>

  <nav class="header-nav" id="header-nav-menu" aria-label="站点主导航">
    <ul class="header-nav-list">
      <li>
        <a class="nav-link{% if page.url == '/' %} is-active{% endif %}" href="{{ '/' | relative_url }}">首页</a>
      </li>
      <li>
        <a class="nav-link{% if page.url contains '/categories' %} is-active{% endif %}" href="{{ '/categories/' | relative_url }}">分类</a>
      </li>
      <li>
        <a class="nav-link{% if page.url contains '/years' %} is-active{% endif %}" href="{{ '/years/' | relative_url }}">归档</a>
      </li>
      <li>
        <a class="nav-link{% if page.url contains '/about' %} is-active{% endif %}" href="{{ '/about/' | relative_url }}">关于</a>
      </li>
      <li class="nav-item-gh">
        <a class="header-gh-btn" href="https://github.com/evanor05" target="_blank" rel="noopener noreferrer" title="访问 evanor05 的 GitHub 主页">
          <img src="{{ '/assets/images/github-mark.svg' | relative_url }}" width="16" height="16" alt="" aria-hidden="true">
          <span>GitHub</span>
          <svg class="external-icon" viewBox="0 0 12 12" width="10" height="10" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M3.5 2a.5.5 0 0 0 0 1h4.793L1.146 10.146a.5.5 0 0 0 .708.708L9 3.707V8.5a.5.5 0 0 0 1 0v-6a.5.5 0 0 0-.5-.5h-6z"/>
          </svg>
        </a>
      </li>
    </ul>
  </nav>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    var toggleBtn = document.querySelector(".nav-toggle-btn");
    var navMenu = document.querySelector(".header-nav");
    if (toggleBtn && navMenu) {
      toggleBtn.addEventListener("click", function() {
        var expanded = toggleBtn.getAttribute("aria-expanded") === "true";
        toggleBtn.setAttribute("aria-expanded", String(!expanded));
        navMenu.classList.toggle("is-open", !expanded);
      });
    }
  });
</script>
